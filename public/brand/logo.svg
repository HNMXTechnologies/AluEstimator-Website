<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 270" role="img" aria-label="AluEstimator — Smart estimates for aluminium works">
  <title>AluEstimator</title>
  <svg x="0" y="5" width="260" height="260" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ae-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4FC7"/>
      <stop offset="1" stop-color="#1A3594"/>
    </linearGradient>
    <linearGradient id="ae-alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E979F"/>
      <stop offset="0.45" stop-color="#C3C9CF"/>
      <stop offset="1" stop-color="#6B747D"/>
    </linearGradient>
    <linearGradient id="ae-alu-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E464F"/>
      <stop offset="1" stop-color="#5F6872"/>
    </linearGradient>
    <linearGradient id="ae-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAF2"/>
    </linearGradient>
    <linearGradient id="ae-swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A3594" stop-opacity="0.15"/>
      <stop offset="0.35" stop-color="#1A3594"/>
      <stop offset="0.7" stop-color="#2A4FC7"/>
      <stop offset="1" stop-color="#2A4FC7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 1)">
  <!-- Back sash: blue frame, opening away (narrower on the right) -->
  <path fill="url(#ae-blue)" fill-rule="evenodd"
        d="M14 27 L52 21 L52 101 L14 101 Z
           M20 33.2 L46 29.4 L46 95.5 L20 95.5 Z"/>
  <path fill="url(#ae-glass)" d="M20 33.2 L46 29.4 L46 95.5 L20 95.5 Z"/>
  <path fill="url(#ae-blue)" d="M30.5 33.2 L34.5 32.6 L34.5 94 L30.5 94 Z"/>

  <!-- Front sash: aluminium frame with a visible depth face -->
  <path fill="url(#ae-alu-side)" d="M41 20 L50 13 L50 103 L41 101 Z"/>
  <path fill="url(#ae-alu)" fill-rule="evenodd"
        d="M50 13 L94 9 L94 101 L50 103 Z
           M56 19 L88 16.3 L88 95.6 L56 97 Z"/>
  <path fill="url(#ae-glass)" d="M56 19 L88 16.3 L88 95.6 L56 97 Z"/>
  <path fill="#9CA4AC" d="M66.5 19.7 L69.5 19.5 L69.5 94.9 L66.5 95 Z"/>
  <path fill="#9CA4AC" d="M75 19 L78 18.7 L78 94.4 L75 94.6 Z"/>
  <path fill="#FFFFFF" opacity="0.55" d="M59.5 23 L64 22.6 L60.5 50 L59.5 50 Z"/>

  </g>

  <!-- Base swoosh -->
  <path fill="url(#ae-swoosh)"
        d="M5 113 C 36 97.5, 88 96.5, 124 104.5 C 90 100.5, 38 103, 5 113 Z"/>
</svg>
  <text x="280" y="152"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="136" font-weight="700" letter-spacing="-3"><tspan fill="#1E40AF">Alu</tspan><tspan fill="#2B3340">Estimator</tspan></text>
  <rect x="284" y="180" width="804" height="3" rx="1.5" fill="#B8C0CA"/>
  <text x="284" y="228"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="600" letter-spacing="6" fill="#3F4856">SMART ESTIMATES FOR ALUMINIUM WORKS</text>
</svg>
